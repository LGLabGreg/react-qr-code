version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    ignore:
      # Deliberately pinned: esbuild <= 0.28.1 reproduces the down-levelling bug
      # behind #621, which the production-bundle smoke test guards against.
      # See packages/react-qr-code/scripts/smoke-test.mjs.
      - dependency-name: 'esbuild'
    groups:
      react:
        patterns:
          - 'react*'
      typescript:
        patterns:
          - '@types*'
          - 'ts*'
          - 'typescript*'
      oxc:
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
      radix:
        patterns:
          - '@radix-ui*'
      vite|vitest:
        patterns:
          - 'vite*'
          - '@vite*'
      tailwind:
        patterns:
          - 'tailwind*'
          - '@tailwind*'
      all-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
